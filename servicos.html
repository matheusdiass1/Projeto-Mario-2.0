<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Serviços Disponíveis</title>
</head>

<body>

    <div class="header">
        <img src="./assets/logo-header.png" alt="mario-header">

    <div class="caixa-info-texto-servicos">
